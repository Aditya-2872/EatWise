<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#065f46" />
    <title>Offline · EatWise</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: linear-gradient(160deg, #065f46, #10b981);
        color: #fff;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 32px 24px;
        backdrop-filter: blur(6px);
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.925rem;
        line-height: 1.55;
        opacity: 0.9;
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #065f46;
        background: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 22px;
        cursor: pointer;
      }
      button:hover {
        background: #ecfdf5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="EatWise icon" />
      <h1>You&rsquo;re offline</h1>
      <p>
        EatWise can&rsquo;t reach the server right now. Food logs you saved
        while offline are queued on this device and will sync automatically
        when your connection returns.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
